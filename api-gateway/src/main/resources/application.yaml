
server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/accounts/**

        - id: transfer-service
          uri: lb://TRANSFER-SERVICE
          predicates:
            - Path=/transfer/**

        - id: bill-service
          uri: lb://BILL-SERVICE
          predicates:
            - Path=/bills/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
